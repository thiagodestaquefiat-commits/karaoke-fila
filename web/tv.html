<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tela da TV · Karaokê</title>
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/tv.css">
</head>
<body>
  <main class="tv">
    <section class="tv-left">
      <div class="tv-now">
        <span class="tv-eyebrow">AGORA NO PALCO</span>
        <span id="now-singer" class="tv-singer">—</span>
        <span id="now-song" class="tv-song"></span>
      </div>

      <div class="tv-next">
        <span class="tv-eyebrow muted">PRÓXIMOS</span>
        <ol id="next" class="tv-list"></ol>
        <span id="tv-more" class="muted"></span>
      </div>
    </section>

    <aside class="tv-qr">
      <img class="logo tv-logo" data-logo alt="">
      <span class="tv-qr-title">Quer cantar?</span>
      <div id="qr" class="qr" role="img" aria-label="QR code para pedir música"></div>
      <span class="tv-qr-text">Aponte a câmera, escolha a música<br>e acompanhe sua vez pelo celular</span>
      <span id="tv-closed" class="tv-closed hidden">Pedidos fechados no momento</span>
    </aside>
  </main>

  <!-- Vídeo em tela cheia (só quando esta janela é o player da TV: tv.html?player=1) -->
  <div id="tv-video" class="tv-video hidden">
    <div id="tv-player"></div>
    <div id="tv-loading" class="tv-loading hidden" aria-live="polite"></div>
    <div id="tv-fake" class="tv-fake hidden" aria-live="polite"></div>
  </div>

  <!-- O navegador só libera som depois de um clique nesta janela -->
  <div id="tv-activate" class="tv-activate hidden">
    <img class="logo tv-activate-logo" data-logo alt="">
    <button id="btn-activate" class="btn btn-primary tv-activate-btn" type="button">Ligar vídeo e som da TV</button>
    <p>Clique uma vez para o navegador liberar o som.<br>A janela entra em tela cheia; se não entrar, aperte F11.</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="js/tv.js"></script>
</body>
</html>
